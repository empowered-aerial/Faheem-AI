<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">
  <title>FAHEEM AI | فهيم</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1118; --panel:#121d27; --panel2:#172532; --line:#263847; --text:#edf4f7; --muted:#9aabb6; --accent:#48c6a5; --accent2:#1c8e78; --danger:#e58c8c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% 0%,#18313b 0,transparent 35%),var(--bg); color:var(--text); font-family:Tahoma,Arial,sans-serif; }
    .shell { width:min(1180px,94vw); margin:34px auto; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:22px; }
    .brand { display:flex; align-items:center; gap:13px; }
    .logo { width:48px; height:48px; display:grid; place-items:center; border-radius:15px; background:linear-gradient(145deg,var(--accent),#167b70); color:#06231e; font-weight:900; font-size:22px; }
    h1 { margin:0; font-size:25px; } .subtitle { color:var(--muted); margin-top:5px; font-size:13px; }
    .status { color:var(--muted); font-size:12px; } .status::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-left:8px; } .status[data-state="offline"]::before { background:var(--danger); }
    .layout { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr); gap:18px; }
    .panel { background:rgba(18,29,39,.94); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:0 18px 55px #0003; }
    .panel-head { min-height:64px; display:flex; justify-content:space-between; align-items:center; padding:17px 20px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font-size:16px; } .small { color:var(--muted); font-size:12px; }
    #messages { height:475px; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
    .message { max-width:88%; padding:12px 15px; border-radius:15px; white-space:pre-wrap; line-height:1.8; font-size:14px; overflow-wrap:anywhere; }
    .message.bot { align-self:flex-start; background:var(--panel2); border:1px solid #2a3d4b; border-top-right-radius:5px; }
    .message.user { align-self:flex-end; background:#155d56; border:1px solid #237e70; border-top-left-radius:5px; }
    .message.error { align-self:flex-start; background:#3b2024; border:1px solid #704047; color:#ffdede; }
    .quick { padding:0 18px 14px; display:flex; flex-wrap:wrap; gap:8px; }
    .quick button,.secondary { background:#1a2b37; color:#cfe0e6; border:1px solid #304654; border-radius:999px; padding:8px 12px; cursor:pointer; font:inherit; font-size:12px; }
    .composer { display:flex; gap:10px; padding:15px 18px 18px; border-top:1px solid var(--line); }
    textarea { resize:none; min-height:46px; max-height:120px; flex:1; border:1px solid #314654; border-radius:13px; padding:12px 14px; outline:none; color:var(--text); background:#0d1720; font:inherit; line-height:1.5; }
    textarea:focus { border-color:var(--accent); }
    .primary { border:0; border-radius:13px; background:var(--accent); color:#06231e; padding:0 20px; font-weight:700; cursor:pointer; font:inherit; }
    .primary:disabled { opacity:.55; cursor:wait; }
    .mic-btn {
    min-width: 50px;
    border-radius: 13px;
    font-size: 20px;
}

.mic-btn.recording {
    background: #7a3038;
    color: white;
    border-color: #a64d57;
}

.mic-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.voice-status {
    min-height: 20px;
    padding: 0 18px 12px;
    color: var(--muted);
    font-size: 12px;
}
    #reportContent { padding:20px; min-height:475px; color:#e0ecef; line-height:2; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .report-foot { border-top:1px solid var(--line); padding:13px 18px; color:var(--muted); font-size:11px; line-height:1.7; }
    @media(max-width:800px) { .shell{margin:18px auto}.layout{grid-template-columns:1fr}#messages{height:390px}#reportContent{min-height:260px}header{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="logo">ف</div><div><h1>فهيم | FAHEEM AI</h1><div class="subtitle">مساعد ذكي لفهم البلاغات المدنية باللغة العربية</div></div></div>
      <div id="connectionStatus" class="status" data-state="online">جاهز للاتصال</div>
    </header>
    <section class="layout">
      <div class="panel">
        <div class="panel-head"><div><h2>المحادثة</h2><div class="small">اشرح المشكلة بلغتك ولهجتك</div></div><button id="newReportBtn" class="secondary">بلاغ جديد</button></div>
        <div id="messages" aria-live="polite"></div>
        <div class="quick">
          <button data-quick-message="في حفرة كبيرة في الشارع في البطين قريب من المدرسة من يومين">حفرة في الطريق</button>
          <button data-quick-message="إنارة الشارع معطلة في الخالدية مقابل المسجد">إنارة معطلة</button>
          <button data-quick-message="النفايات متراكمة في مدينة خليفة">تراكم نفايات</button>
        </div>
        <div class="composer">
  <textarea id="userInput" rows="1" placeholder="اكتب وصف المشكلة هنا..." aria-label="وصف المشكلة"></textarea>
  <button id="micBtn" class="secondary mic-btn" type="button" title="تسجيل صوتي" aria-label="تسجيل صوتي">🎙️</button>
  <button id="sendBtn" class="primary">إرسال</button>
</div>
<div id="voiceStatus" class="voice-status" aria-live="polite"></div>
      </div>
      <aside class="panel">
        <div class="panel-head"><div><h2>مسودة البلاغ</h2><div class="small">تظهر بعد تأكيد الموقع</div></div><span class="small">معاينة</span></div>
        <div id="reportContent" dir="rtl">سيظهر ملخص البلاغ هنا بعد تأكيد الموقع.</div>
        <div class="report-foot">هذه مسودة تجريبية للمراجعة فقط. لا يتم إرسال البلاغ إلى أي جهة حكومية.</div>
      </aside>
    </section>
  </main>
  <script src="faheem_chatbot_script.js"></script>
  <script src="faheem_report_review.js"></script>
</body>
</html>
